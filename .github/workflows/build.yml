name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      # The APK and artifact names carry the app version, so builds are never confused.
      - name: Rename APK
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TelikIVI-$VERSION.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: TelikIVI-apk-${{ env.VERSION }}
          path: out/TelikIVI-${{ env.VERSION }}.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TelikIVI-${{ env.VERSION }}.apk
