plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.telik.ivi'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.telik.ivi'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '0.2'
        // Only keep resources we actually ship (no extra translations from libraries).
        resourceConfigurations += ['ru', 'en']
    }

    signingConfigs {
        release {
            // Keystore lives in the repo so every CI build has the same signature
            // and a new APK installs over the old one. Can be overridden by CI secrets.
            storeFile file(System.getenv('SIGNING_STORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'teliktv'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'teliktv'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'teliktv'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packaging {
        resources {
            excludes += ['META-INF/**', 'kotlin/**', '**/*.kotlin_builtins', '**/*.version']
        }
    }
}

dependencies {
    // None: the app is only the system WebView plus a pointer for the remote.
}
