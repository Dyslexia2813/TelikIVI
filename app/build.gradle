plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.telik.ivi'
    compileSdk 36

    defaultConfig {
        applicationId 'tv.telik.ivi'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '0.7'
        // Only keep resources we actually ship (no extra translations from libraries).
        resourceConfigurations += ['ru', 'en']
        // The box is 32-bit ARM; one engine build instead of four keeps the APK much smaller.
        ndk { abiFilters 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            // Keystore lives in the repo so every CI build has the same signature
            // and a new APK installs over the old one. Can be overridden by CI secrets.
            storeFile file(System.getenv('SIGNING_STORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'teliktv'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'teliktv'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'teliktv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin/**', '**/*.kotlin_builtins']
        }
    }
}

dependencies {
    // Firefox's engine: the box's own browser (Chrome 52, 2016) can't run ivi's scripts.
    // 144 is the last release that still supports Android 7 (from 145 it needs Android 8).
    implementation 'org.mozilla.geckoview:geckoview:144.+'
}
